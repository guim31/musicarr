name: Docker Publish

# Se déclenche sur les tags de version (vX.Y.Z), à la suite du flux de release
# décrit dans CONTRIBUTING.md : PR dev → main, puis tag sur main. Ne publie
# jamais une image qui n'a pas passé la même CI (lint + types + build + image)
# que les branches. Le tag `latest` permet à Unraid de détecter les mises à
# jour du container et de les proposer dans la webgui.
#
# Le déclenchement manuel (workflow_dispatch, onglet Actions → Run workflow)
# publie la version de package.json depuis la branche choisie — utile pour
# re-publier une version ou publier sans pousser de tag.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Déterminer le SHA court et la version
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # Sur un tag : le nom du tag. En déclenchement manuel : la version de package.json.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            guilhem31/musicarr:latest
            guilhem31/musicarr:${{ steps.vars.outputs.version }}
            guilhem31/musicarr:${{ steps.vars.outputs.sha_short }}
