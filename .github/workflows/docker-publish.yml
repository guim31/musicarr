name: Publier l'image Docker

# Budget Actions volontairement contenu (compte Free, quota saturé en août 2026) :
# l'image n'est construite QUE sur pose d'un tag « v* » ou sur déclenchement manuel.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          # Le NAS est un x86 : inutile de payer un build ARM.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache GitHub Actions : les builds suivants ne refont que ce qui a changé.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Manifeste mono-plateforme propre, sans entrée « unknown/unknown » :
          # c'est ce que la vérification de mise à jour d'Unraid interroge.
          provenance: false

      - name: Récapitulatif
        run: |
          echo "### Image publiée" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
