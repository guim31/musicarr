name: 🐛 Rapport de bug
description: Signaler un dysfonctionnement
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que s'est-il passé ?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Aller sur …
        2. Cliquer sur …
        3. Observer …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Page /debug de l'application ou `docker compose logs musicarr`.
      render: shell

  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      options:
        - Développement local (npm run dev)
        - Docker local
        - NAS / Unraid
    validations:
      required: true
