services:
  musicarr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musicarr
    ports:
      - "3005:3000"
    volumes:
      - ./data:/app/data
      - ${MUSIC_DIR:-/mnt/user/data/media/music}:/app/music
    environment:
      - NODE_ENV=production
    restart: unless-stopped
