services:
  musicarr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musicarr
    ports:
      - "3005:3000"
    volumes:
      - ./data:/app/data
      - ${MUSIC_DIR:-/mnt/user/data/media/music}:/app/music
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  sqlite-web:
    image: coleifer/sqlite-web
    container_name: musicarr-db-admin
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - ./data:/data
    environment:
      - SQLITE_DATABASE=musicarr.db

